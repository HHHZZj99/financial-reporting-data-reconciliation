name: Project checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python src/reconcile.py

  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dbt.txt
      - name: Configure local dbt profile
        run: |
          mkdir -p ~/.dbt
          cp profiles.yml.example ~/.dbt/profiles.yml
          echo "DBT_DUCKDB_PATH=$RUNNER_TEMP/financial_reconciliation.duckdb" >> "$GITHUB_ENV"
      - run: dbt debug --project-dir . --profiles-dir ~/.dbt
      - run: dbt build --project-dir . --profiles-dir ~/.dbt
